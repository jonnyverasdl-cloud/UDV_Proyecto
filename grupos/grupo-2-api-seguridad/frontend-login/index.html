<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio sesion</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="signup-container">
    <!-- Columna Izquierda: Formulario -->
    <div class="left-panel">
      <!-- icono-->
      <div class="brand">
       <!-- <i class="fa-solid fa-cube logo-icon"></i> -->
        <span class="brand-name">...</span>
      </div>

      <!-- Formulario Central -->
      <div class="form-wrapper">
        <span class="subtitle">Bienvenido</span>
        <h1>Inicio de Sesion</h1>

        <form action="#">
          <!-- Input usuario con Outlined Label -->
          <div class="floating-input-group">
            <input type="text" id="text" placeholder=" " required />
            <label for="text">Usuario</label>
            <i class="fa-regular fa-user icon"></i>
          </div>

          <!-- Input Password con Outlined Label -->
          <div class="floating-input-group">
            <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password" />
            <label for="password">Contraseña</label>
            <i class="fa-regular fa-eye icon" id="togglePassword"></i>
          </div>

          <!-- Botón de Registro -->
          <button type="submit" class="btn-primary">Iniciar sesion</button>
        </form>

        <!-- Divisor con Texto -->
        <div class="divider">
        <label class="checkbox-container">
          <input type="checkbox" checked>
          <span class="checkmark"></span>
          Recordarme?
        </label>
        </div>
        
      </div>

      <!-- Pie de página -->
      <div class="footer-link">
         <a href="#">Olvido su contraseña?</a>
      </div>
    </div>

    <!-- Columna Derecha: Imagen  -->
    <div class="right-panel">
      <div class="slider-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>
  
  <!--Scrip javaScript-->
  <script src="script.js"></script>
</body>
</html>
