# Entorno local completo (mantenido por el PM): MySQL con la base del G1 + la API.
#
#   cp .env.example .env        (y cambiar las contraseñas)
#   docker compose up --build
#
#   API:      http://localhost:8000/api/v1/docs
#   Salud:    http://localhost:8000/health  y  /health/db
#   MySQL:    localhost:3307  (usuario y clave del .env)
#
# Volver a crear la base desde cero (borra los datos locales):
#   docker compose down -v && docker compose up --build

services:
  db:
    # Misma versión que el MySQL de Railway (8.4).
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: db_udv
      MYSQL_USER: ${MYSQL_USER:-udv_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD en .env}
      TZ: America/Guatemala
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT_LOCAL:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Solo corre la primera vez (volumen vacío), en orden: esquema y datos semilla del G1.
      # G1_SQL_DIR permite probar otra carpeta con 01_schema.sql y 02_seed.sql sin tocar el repo.
      - ${G1_SQL_DIR:-./grupos/grupo-1-base-de-datos/Docs/sql}/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ${G1_SQL_DIR:-./grupos/grupo-1-base-de-datos/Docs/sql}/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-udv_app}:${MYSQL_PASSWORD}@db:3306/db_udv
      PORT: 8000
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"

volumes:
  mysql-data:
